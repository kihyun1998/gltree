[package]
name = "gltree"
version = "0.3.0"
edition = "2024"
description = "Issue trees for GitLab trackers whose parent is the body's first line `Parent: #N`"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kihyun1998/gltree"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["native-tls", "vendored"] }

# macOS native-tls (Security.framework) refuses a server certificate whose validity span exceeds
# Apple's maximum, which a self-hosted CE's long-lived self-signed CA:TRUE sheet always does. On
# macOS a configured CA is verified by our own pinned rustls verifier instead (src/macos_tls.rs);
# every other platform keeps native-tls, so these deps are macOS-only.
[target.'cfg(target_os = "macos")'.dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = "0.18"

[target.'cfg(target_os = "macos")'.dev-dependencies]
rcgen = "0.14"
