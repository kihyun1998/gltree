[package]
name = "gltree"
version = "0.1.0"
edition = "2024"
description = "Issue trees for GitLab trackers whose parent is the body's first line `Parent: #N`"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kihyun1998/gltree"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["native-tls"] }
