<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gltree</title>
<style>
:root{color-scheme:light dark;--bg:#fafafa;--surface:#fff;--ink:#111;--sub:#6b6b6b;--faint:#a3a3a3;--hair:#ececec;--accent:#4f46e5;--done:#16a34a;--warn:#ea580c;--r:14px;--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--surface:#141416;--ink:#f2f2f3;--sub:#9a9aa1;--faint:#5c5c63;--hair:#232327;--accent:#818cf8;--done:#4ade80;--warn:#fb923c}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Pretendard","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
html,body{height:100%}body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{flex:none;position:relative;z-index:5;backdrop-filter:saturate(1.4) blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--hair)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 28px}
.logo{font-weight:650;letter-spacing:-.02em}
.grow{flex:1}
.switch{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;cursor:pointer;user-select:none}
.switch i{width:34px;height:20px;border-radius:999px;background:var(--hair);position:relative;transition:background .3s}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .4s var(--ease)}
.switch.on i{background:var(--accent)}.switch.on i:after{transform:translateX(14px)}
.refresh{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--hair);border-radius:999px;background:var(--surface);font-size:13px;transition:box-shadow .2s}
.refresh:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.refresh svg{width:14px;height:14px}
.refresh.busy svg{animation:spin .8s linear infinite}.refresh.ok{color:var(--done);border-color:color-mix(in srgb,var(--done) 40%,transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
.stamp{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;min-width:70px}
main{flex:1;min-height:0;width:100%;max-width:1080px;margin:0 auto;padding:36px 28px 24px;display:flex;flex-direction:column}
#m{flex:1;min-height:0;display:flex;flex-direction:column}
.hero{display:flex;align-items:flex-end;gap:40px;margin-bottom:28px}
.hero h2{font-size:28px;letter-spacing:-.03em;margin:0;font-weight:650}
.kpi{display:flex;gap:28px}.kpi div{display:flex;flex-direction:column}.kpi b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.kpi span{color:var(--sub);font-size:12px}
.st{flex:none;width:16px;height:16px;display:inline-block}
.st.open{border:2px solid var(--accent);border-radius:50%}
.st.blocked{border:2px solid var(--warn);border-radius:50%;position:relative}
.st.blocked:after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;background:var(--warn)}
.st.done{border-radius:50%;background:var(--done);position:relative}
.st.done:after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.num{color:var(--faint);font-variant-numeric:tabular-nums;font-size:13px}
.title{overflow-wrap:anywhere}.title.closed{color:var(--sub)}
.blk{font-size:11px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:999px;padding:1px 7px}.detail h3~.blk{margin-left:6px}
.enter{animation:fade .22s ease both}@keyframes fade{from{opacity:0}}
.ghost{position:absolute;margin:0;z-index:2;animation:out .22s ease forwards}@keyframes out{to{opacity:0}}
.split{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:320px 1fr;grid-template-rows:minmax(0,1fr);gap:28px}
.split>div:first-child{display:flex;flex-direction:column;min-height:0}
.list{flex:1;min-height:0;overflow:auto;position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:6px}
.list .hl{position:absolute;left:6px;right:6px;border-radius:10px;background:var(--hair);transition:top .22s var(--ease),height .22s var(--ease)}
.li{position:relative;z-index:1;display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 12px;border-radius:10px;width:100%;text-align:left}
.li .st{margin-top:2px}
.li .title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li small{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--faint);font-size:12px;margin-top:2px}.pg{width:72px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--faint) 30%,transparent);overflow:hidden}.pg i{display:block;height:100%;background:var(--done)}
.left{font-size:12px;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}.left.none{color:var(--done)}
.detail{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:28px;max-height:100%;overflow:auto}
.detail h3{margin:0 0 6px;font-size:22px;letter-spacing:-.02em;font-weight:650}
.ring{width:64px;height:64px}.ring circle{fill:none;stroke-width:5}.ring .bg{stroke:var(--hair)}.ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .4s var(--ease);transform:rotate(-90deg);transform-origin:center}
.head{display:flex;align-items:center;gap:8px}
.tree{margin-top:22px}.node{display:grid;grid-template-columns:18px 50px minmax(0,1fr) 14px;column-gap:8px;align-items:start;padding:7px 8px;margin:0 -8px}
.node .st{margin-top:3px}.node .meta{grid-column:3;display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.node .meta .chip{max-width:100%;overflow-wrap:anywhere}
.fold{width:calc(100% + 16px);text-align:left;color:var(--sub);border-radius:8px}.fold span{grid-column:2/-1}.fold:hover{background:var(--hair)}
.empty{color:var(--sub);padding:60px 0;text-align:center}

.badge{font-size:11px;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid var(--hair);color:var(--sub)}
.badge.todo{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.li .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip{font-size:12px;padding:2px 9px;border-radius:6px;background:var(--hair);color:var(--sub)}
.fieldbox{margin-top:18px;border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.fieldbox .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.fieldbox code{font:13px ui-monospace,SFMono-Regular,Consolas,monospace}
.open-gl{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:7px 12px;border-radius:999px;background:var(--ink);color:var(--surface);text-decoration:none}
a.node{color:inherit;text-decoration:none;border-radius:8px;transition:background .2s}
a.node:hover{background:var(--hair)}a.node .go{opacity:0;transition:opacity .22s ease;color:var(--faint)}
a.node:hover .go{opacity:1}

.badge.val{color:var(--done);border-color:color-mix(in srgb,var(--done) 35%,transparent);background:color-mix(in srgb,var(--done) 8%,transparent)}
.banner{margin:0 0 22px;padding:12px 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);color:var(--warn)}
.stale{font-size:12px;color:var(--warn);margin-top:14px}
.tabs{flex:none;display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.tab{display:flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--hair);border-radius:999px;background:var(--surface);font-size:13px;color:var(--sub)}
.tab:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}.tab.on{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 55%,transparent)}
.tab .n{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}.tab .n.none{color:var(--done)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}.dot.reading{background:var(--accent)}.dot.failed{background:var(--warn)}
</style></head><body>
<div class="top"><div class="in">
 <span class="logo">gltree</span>
 <span class="grow"></span>
 <span class="switch" id="sw" role="switch" aria-checked="false" tabindex="0"><i></i>Finished families</span>
 <span class="switch" id="sd" role="switch" aria-checked="false" tabindex="0"><i></i>Show done items</span>
 <button class="refresh" id="rf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>Refresh</span></button>
 <span class="stamp" id="at"></span>
</div></div>
<main><nav class="tabs" id="tabs" aria-label="Repos" hidden></nav><p class="banner" id="err" hidden></p><div id="m"><div class="empty">Reading…</div></div></main>
<script>
let repos=[],repo=null,gen=0,tabTimer=0,data=null,showAll=false,showDone=false,unfolded=new Set(),foldsOf=null,sel=null,last=[null,null],shown=null,listed=null,want=0,walks={},flash=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{if(typeof u!=='string')return null;try{const x=new URL(u);return x.protocol==='http:'||x.protocol==='https:'?x.href:null}catch(e){return null}};
const text=v=>typeof v==='string'?v:JSON.stringify(v);
const finished=r=>r.state==='closed'&&r.closed===r.total;
const pct=n=>n.total?Math.round(n.closed/n.total*100):(n.state==='closed'?100:0);
const shut=n=>n.state==='closed'?'closed':'';
const mark=n=>{const k=n.state==='closed'?'done':n.blocked_by_open.length?'blocked':'open';return '<span class="st '+k+'" role="img" aria-label="'+{done:'done',blocked:'blocked',open:'to do'}[k]+'"></span>'};
const left=n=>n.total?n.total-n.closed:n.state==='open'?1:0;const title=n=>'<span class="title '+shut(n)+'">'+esc(n.title)+'</span>';
const blk=n=>n.blocked_by_open.length?'<span class="blk">blocked by '+n.blocked_by_open.map(b=>'#'+esc(b)).join(', ')+'</span>':'';
const flat=(n,d=0,o=[])=>{o.push({n,d});n.children.forEach(c=>flat(c,d+1,o));return o};
function marks(r){return data.badges.map(b=>{const l=r.labels.find(x=>x.startsWith(b.prefix));
 if(l!==undefined)return{b,value:l.slice(b.prefix.length)};
 if(r.state==='closed'&&b.missing!=null)return{b,missing:true};return null}).filter(Boolean)}
const chip=m=>m.missing?'<span class="badge todo">'+esc(m.b.name)+': '+esc(m.b.missing)+'</span>':'<span class="badge val">'+esc(m.b.name)+': '+esc(m.value)+'</span>';
function hero(every){const open=every.flatMap(r=>flat(r)).filter(x=>x.n.state==='open').length;
 const kpi=[[every.length,'families'],[open,'open items']].concat(data.badges.filter(b=>b.missing!=null).map(b=>[every.filter(r=>marks(r).some(m=>m.b===b&&m.missing)).length,b.name+': '+b.missing]));
 return '<div class="hero enter"><h2>Issue tree</h2><div class="kpi">'+kpi.map(([n,t])=>'<div><b data-roll="'+n+'">0</b><span>'+esc(t)+'</span></div>').join('')+'</div></div>'}
function link(u,cls,inner,extra){const h=safeUrl(u);return h?'<a class="'+cls+'" href="'+esc(h)+'" target="_blank" rel="noopener noreferrer"'+(extra||'')+'>'+inner+'</a>':'<div class="'+cls+'"'+(extra||'')+'>'+inner+'</div>'}
const pad=d=>' style="padding-left:'+(8+(d-1)*22)+'px"';
const node=(n,d)=>{const more=n.labels.slice(3),meta=blk(n)+n.labels.slice(0,3).map(l=>'<span class="chip">'+esc(l)+'</span>').join('')+(more.length?'<span class="chip" title="'+esc(more.join(', '))+'">+'+more.length+'</span>':'');
 return link(n.url,'node',mark(n)+'<span class="num">#'+esc(n.number)+'</span>'+title(n)+(safeUrl(n.url)?'<span class="go">↗</span>':'')+(meta?'<div class="meta">'+meta+'</div>':''),' data-n="'+esc(n.number)+'"'+pad(d))};
function branch(p,d,o,all){const fold=!(all||showDone||unfolded.has(p.number));let put=false;
 p.children.forEach(c=>{if(fold&&finished(c)){if(!put){put=true;o.push('<button class="node fold" data-u="'+esc(p.number)+'"'+pad(d)+'><span>✓ '+p.children.filter(finished).length+' done — show</span></button>')}return}
  o.push(node(c,d));branch(c,d+1,o,all||finished(c))});return o}
function detail(r,note){if(!r)return '<div class="detail" id="det"><div class="empty">Nothing left to do</div></div>';
 const C=2*Math.PI*27,gl=safeUrl(r.url);
 return '<div class="detail" id="det"><div style="display:flex;gap:18px;align-items:center"><svg class="ring" viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" cx="32" cy="32" r="27" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" data-off="'+(C*(1-pct(r)/100))+'"/></svg><div style="flex:1"><div class="head">'+mark(r)+'<span class="num">#'+esc(r.number)+' · '+esc(r.state)+'</span></div><h3>'+esc(r.title)+'</h3><span class="num">'+(r.total?esc(r.closed)+' / '+esc(r.total)+' descendants closed':'no descendants')+'</span>'+blk(r)+'</div>'+(gl?'<a class="open-gl" href="'+esc(gl)+'" target="_blank" rel="noopener noreferrer">Open in GitLab ↗</a>':'')+'</div>'
 +(r.labels.length?'<div class="chips">'+r.labels.map(l=>'<span class="chip">'+esc(l)+'</span>').join('')+'</div>':'')
 +marks(r).map(m=>{const v=m.b.extra!=null?r.extra[m.b.extra]:undefined;
   return '<div class="fieldbox">'+chip(m)+(v!=null?'<div><div class="k">extra.'+esc(m.b.extra)+'</div><code>'+esc(text(v))+'</code></div>':m.missing?'<div class="num">Closed with no '+esc(m.b.prefix)+' label</div>':'')+'</div>'}).join('')
 +(note?'<div class="stale">'+esc(note)+'</div>':'')
 +'<div class="tree">'+branch(r,1,[]).join('')+'</div></div>'}
function pick(){const every=data.tree.roots,roots=every.filter(r=>showAll||!finished(r)).sort((a,b)=>b.number-a.number);
 if(!roots.find(r=>r.number===sel))sel=roots.length?roots[0].number:null;return {every,roots}}
const rows=roots=>roots.length?roots.map(x=>{const k=left(x);return '<button class="li" data-s="'+esc(x.number)+'">'+mark(x)+'<span>'+title(x)+'<small>#'+esc(x.number)+'<span class="pg"><i style="width:'+pct(x)+'%"></i></span>'+blk(x)+'</small></span><span class="r">'+(k?'<span class="left">'+k+' left</span>':'<span class="left none">done</span>')+marks(x).map(chip).join('')+'</span></button>'}).join(''):'<div class="empty">None</div>';
const still=()=>typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function roll(){const calm=still();document.querySelectorAll('[data-roll]').forEach(el=>{const to=+el.dataset.roll,t0=performance.now();if(calm){el.textContent=to;return}const f=t=>{const k=Math.min(1,(t-t0)/300);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function moveHl(stay){const l=$('#lst');if(!l)return;const b=l.querySelector('[data-s="'+sel+'"]'),h=l.querySelector('.hl');if(b){h.style.opacity=1;h.style.top=b.offsetTop+'px';h.style.height=b.offsetHeight+'px';if(!stay)into(l,b)}else h.style.opacity=0}
function into(l,b){const t=b.offsetTop,e=t+b.offsetHeight;if(t<l.scrollTop)l.scrollTop=t;else if(e>l.scrollTop+l.clientHeight)l.scrollTop=e-l.clientHeight}
function fade(o,html){const t=document.createElement('template');t.innerHTML=html;const n=t.content.firstElementChild;n.classList.add('enter');
 if(!o.firstChild||still())return o.replaceWith(n);
 const at={top:o.offsetTop+'px',left:o.offsetLeft+'px',right:o.parentNode.clientWidth-o.offsetLeft-o.offsetWidth+'px',height:o.offsetHeight+'px',opacity:getComputedStyle(o).opacity},end=e=>{if(e.target===o&&e.animationName==='out')o.remove()};
 o.before(n);o.removeAttribute('id');o.classList.add('ghost');o.inert=true;Object.assign(o.style,at);
 o.addEventListener('animationend',end);o.addEventListener('animationcancel',end)}
function ring(){const c=$('.ring .fg');if(c)requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.strokeDashoffset=c.dataset.off))}
function fail(m){const e=$('#err');e.textContent=m;e.hidden=false}
const clock=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function stamp(){$('#at').textContent=data?'Read '+clock(data.read_at):''}
function sync(){[[$('#sw'),showAll],[$('#sd'),showDone]].forEach(([s,on])=>{s.classList.toggle('on',on);s.setAttribute('aria-checked',String(on))})}
function by(k,v){const w=$(k==='s'?'#rows':'#det');return w&&[...w.querySelectorAll('[data-'+k+']')].find(e=>e.dataset[k]===v)}
function go(n){if(!n)return;n.focus({preventScroll:true});if(document.activeElement!==n){n.tabIndex=-1;n.addEventListener('blur',()=>n.removeAttribute('tabindex'),{once:true});n.focus({preventScroll:true})}const l=$('#lst');if(l&&n.parentNode===$('#rows'))into(l,n)}
function hold(root){const a=document.activeElement;if(!a||!root.contains(a))return ()=>{};
 const k=['s','n','u'].find(k=>k in a.dataset),v=k&&a.dataset[k],gl=a.matches('.open-gl'),id=a.id,inList=!!a.closest('#lst'),fam=sel,i=a.parentNode.matches('.tree')?[...a.parentNode.children].indexOf(a):-1;
 return ()=>{const t=$('#det .tree'),n=k?by(k,v):gl?$('#det .open-gl'):id?document.getElementById(id):null;
  go(n||(inList?by('s',String(sel))||$('#lst'):sel===fam&&i>=0&&t&&t.children.length?t.children[Math.min(i,t.children.length-1)]:$('#det')))}}
function paint(){if(!data)return;const was=sel,d=$('#det'),top=d?d.scrollTop:0,back=hold($('#m')),{every,roots}=pick();
 $('#m').innerHTML=hero(every)+'<div class="split enter"><div><div class="list" id="lst"><span class="hl"></span><div id="rows">'+(listed=rows(roots))+'</div></div></div><div id="det"></div></div>';
 sync();roll();moveHl();stamp();choose();if(sel===was)$('#det').scrollTop=top;back()}
function relist(){if(!data)return;const was=sel,{roots}=pick(),html=rows(roots);
 if(html!==listed){listed=html;fade($('#rows'),'<div id="rows">'+html+'</div>')}sync();moveHl();
 if(sel!==was||sel===null&&detail(null)!==shown)choose()}
async function call(method,path){const r=await fetch(path,{method});let v=null;try{v=await r.json()}catch(e){}
 if(!r.ok)throw new Error(v&&typeof v.error==='string'?v.error:'HTTP '+r.status);return v}
const kept=n=>data.tree.roots.find(r=>r.number===n);
function choose(){want++;if(sel!==foldsOf){unfolded.clear();foldsOf=sel}const r=sel===null?null:kept(sel);last=[r,null];shown=detail(r,null);fade($('#det'),shown);ring();if(sel!==null)fresh(sel)}
function draw(r,note){last=[r,note];const k=detail(r,note);if(k===shown)return;shown=k;
 const d=$('#det'),back=hold(d),o=d.querySelector('.ring .fg'),from=o&&getComputedStyle(o).strokeDashoffset,t=document.createElement('template');
 t.innerHTML=k;d.replaceChildren(...t.content.firstElementChild.childNodes);back();
 const f=d.querySelector('.ring .fg');if(f&&from)f.style.strokeDashoffset=from;ring()}
const q=()=>repo===null?'':'?repo='+encodeURIComponent(repo);
async function fresh(n){const t=++want;let r;
 try{r=(await call('GET','/api/tree/'+n+q())).roots[0]}
 catch(e){if(t!==want)return;const w=walks[n];draw(w?w.root:kept(n),(w?'Showing the read of this family at '+clock(w.at):'Showing the last full read')+': '+e.message);return}
 if(t!==want||!r)return;walks[n]={root:r,at:Date.now()};draw(r)}
const busy=()=>$('#rf').classList.contains('busy');
function button(on,label,ok=false){clearTimeout(flash);const b=$('#rf');b.classList.toggle('busy',on);b.classList.toggle('ok',ok);b.querySelector('span').textContent=label}
function keep(v){if(!data&&v.tree){data=v;paint()}}
function stop(m){button(false,'Refresh');if(!data)$('#m').innerHTML='';fail(m)}
function take(v){const was=busy();
 if(v.state==='reading'){keep(v);if(!was)button(true,'Reading…');const g=gen;setTimeout(()=>{if(g===gen)load()},1000);return}
 tabs();
 if(v.state==='failed'){keep(v);stop((data?'The refresh failed: ':'The read failed: ')+v.error);return}
 button(false,was?'Up to date':'Refresh',was);data=v;walks={};$('#err').hidden=true;paint();
 if(was)flash=setTimeout(()=>button(false,'Refresh'),1400)}
async function ask(method,path,lead){const g=gen;let v;try{v=await call(method,path)}catch(e){if(g===gen){stop(lead+e.message);tabs()}return}if(g===gen)take(v)}
function load(){ask('GET','/api/families'+q(),'Cannot read the families: ')}
function tab(r){const b=[...$('#tabs').children].find(b=>b.dataset.r===r.name);if(!b)return;
 b.querySelector('.n').outerHTML=r.open==null?'<span class="n"></span>':'<span class="n'+(r.open?'':' none')+'">'+esc(r.open)+' left</span>';
 const d=b.querySelector('.dot'),k=r.state==='ready'?'':r.state;d.className='dot '+k;d.hidden=!k;
 d.setAttribute('aria-label',k==='failed'?'read failed':'reading');b.title=k==='failed'?String(r.error):''}
function current(){[...$('#tabs').children].forEach(b=>{const on=b.dataset.r===repo;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
async function tabs(){if(!repos.length)return;clearTimeout(tabTimer);let v;try{v=await call('GET','/api/repos')}catch(e){return}
 v.repos.forEach(tab);clearTimeout(tabTimer);if(v.repos.some(r=>r.state==='reading'))tabTimer=setTimeout(tabs,1500)}
function named(){let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}return repos.includes(h)?h:null}
function show(n){repo=n;gen++;want++;data=null;sel=null;walks={};unfolded.clear();foldsOf=null;last=[null,null];shown=null;listed=null;
 $('#err').hidden=true;$('#m').innerHTML='<div class="empty">Reading…</div>';button(false,'Refresh');stamp();current();load()}
async function boot(){let v=null;try{v=await call('GET','/api/repos')}catch(e){}
 repos=v&&Array.isArray(v.repos)?v.repos.map(r=>String(r.name)):[];
 if(!repos.length){load();return}
 const t=$('#tabs');t.innerHTML=repos.map(n=>'<button class="tab" data-r="'+esc(n)+'"><span class="dot" role="img" hidden></span><span>'+esc(n)+'</span><span class="n"></span></button>').join('');t.hidden=false;
 v.repos.forEach(tab);if(v.repos.some(r=>r.state==='reading'))tabTimer=setTimeout(tabs,1500);
 t.onclick=e=>{const b=e.target.closest('[data-r]');if(b)location.hash=encodeURIComponent(b.dataset.r)};
 addEventListener('hashchange',()=>{const n=named();if(n!==null&&n!==repo)show(n)});
 const n=named()??repos[0];if(named()===null)history.replaceState(null,'','#'+encodeURIComponent(n));show(n)}
function toggle(){showAll=!showAll;sync();relist()}
function done(){showDone=!showDone;sync();if(data)draw(...last)}
[[$('#sw'),toggle],[$('#sd'),done]].forEach(([s,f])=>{s.onclick=f;s.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();f()}}});
$('#rf').onclick=()=>{if(busy())return;button(true,'Reading…');ask('POST','/api/refresh'+q(),'The refresh failed: ')};
function unfold(u){unfolded.add(+u.dataset.u);draw(...last)}
$('#m').onclick=e=>{const u=e.target.closest('[data-u]');if(u){unfold(u);return}
 const s=e.target.closest('[data-s]');if(s){const n=+s.dataset.s;if(n===sel){fresh(n);return}sel=n;moveHl();choose()}};
addEventListener('resize',()=>moveHl(true));
boot();
</script></body></html>
