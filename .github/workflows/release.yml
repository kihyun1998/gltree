# Release: a v* tag gates, builds six targets, and publishes archives, SHA256SUMS and provenance.
# A push to a release-check/** branch runs the gate and the builds only, and publishes nothing.
# No third-party release tool; every action is pinned by commit SHA.
name: Release
on:
  push:
    tags: ["v*"]
    branches: ["release-check/**"]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: The tag equals the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != Cargo.toml v${crate_version}; set the version and tag again" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    env:
      # the archive's version part: the tag, or the branch name on a release check
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'check' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: musl toolchain (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: |
          name="gltree-${VERSION}-${{ matrix.target }}"
          mkdir "${name}"
          cp "target/${{ matrix.target }}/release/gltree" README.md LICENSE-MIT LICENSE-APACHE "${name}/"
          tar -czf "${name}.tar.gz" "${name}"
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "gltree-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gltree.exe", "README.md", "LICENSE-MIT", "LICENSE-APACHE" $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: The binary runs (native targets)
        if: matrix.target != 'x86_64-apple-darwin' && matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/gltree"
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          "${bin}" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            gltree-*.tar.gz
            gltree-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/*
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
